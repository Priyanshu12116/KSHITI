[project]
name = "kshiti"
version = "1.0.0"
description = "Kshiti · Bhumi Vikas Sahayak: cited answers from the MP Bhumi Vikas Rules 2012 for the BMC building-permission counter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "cerebras-cloud-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
    "fpdf2>=2.8",
    "uharfbuzz>=0.40",
    "fonttools>=4.50",
    "qrcode[pil]>=7.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
